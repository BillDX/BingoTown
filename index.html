<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conference Talk Bingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #13111c;
      color: #cdd6f4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #b4befe;
      margin-bottom: 24px;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 24px;
    }

    .cell {
      border: 1px solid #585b70;
      border-radius: 8px;
      padding: 12px 8px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      background-color: #1e1b2e;
      transition: transform 0.1s ease, border-color 0.1s ease, box-shadow 0.15s ease;
      position: relative;
      min-height: 60px;
    }

    .cell:hover {
      border-color: #b4befe;
      transform: scale(1.03);
    }

    .cell.marked {
      border-color: #a6e3a1;
      background-color: #1e1b2e;
      box-shadow: 0 0 10px #a6e3a1;
    }

    .cell.marked::after {
      content: '';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(21, 17, 36, 0.6);
    }

    .cell.marked::before {
      content: '\2715';
      position: absolute;
      font-size: 2rem;
      color: #a6e3a1;
      z-index: 1;
      text-shadow: 0 0 8px rgba(166, 227, 161, 0.6);
    }

    .cell.free-space {
      font-weight: 700;
      color: #a6e3a1;
    }

    .new-card-btn {
      display: block;
      width: 100%;
      padding: 14px 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 600;
      color: #13111c;
      background-color: #fab387;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.15s ease, background-color 0.1s ease;
    }

    .new-card-btn:hover {
      background-color: #f8a875;
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(250, 179, 135, 0.3);
    }

    .new-card-btn:active {
      transform: scale(0.98);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(19, 17, 28, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .overlay-content {
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .overlay.visible .overlay-content {
      transform: scale(1);
    }

    .overlay-content h2 {
      font-size: 3rem;
      font-weight: 700;
      color: #a6e3a1;
      margin-bottom: 24px;
      text-shadow: 0 0 20px rgba(166, 227, 161, 0.5);
    }

    .overlay-close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #b4befe;
      cursor: pointer;
      padding: 8px;
      position: absolute;
      top: 16px;
      right: 16px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.4rem;
      }

      .cell {
        padding: 8px 4px;
        font-size: 0.65rem;
        min-height: 52px;
      }

      .cell.marked::before {
        font-size: 1.5rem;
      }

      .new-card-btn {
        padding: 12px 16px;
        font-size: 0.9rem;
      }
    }

    @media (min-width: 768px) {
      .cell {
        padding: 16px 8px;
        font-size: 0.85rem;
        min-height: 72px;
      }
    }
  </style>
</head>
<body>
  <h1>Conference Talk Bingo</h1>

  <div class="container">
    <div class="grid" id="bingo-grid"></div>
    <button class="new-card-btn" id="new-card-btn">New Card</button>
  </div>

  <div class="overlay" id="overlay">
    <button class="overlay-close-btn" id="overlay-close" aria-label="Close">&times;</button>
    <div class="overlay-content">
      <h2>BINGO!</h2>
      <button class="new-card-btn" id="play-again-btn">Play Again</button>
    </div>
  </div>

  <script>
    const buzzwords = [
      'agentic', 'AI-native', 'MCP', 'sub-agent', 'orchestration',
      'harness', 'vibe coding', 'spicy autocomplete', 'dark factory', 'worktree',
      'sandbox', 'CLAUDE.md', 'FREE SPACE', 'hooks', 'slash command',
      'prompt engineering', 'context window', 'RAG', 'embedding', 'fine-tune',
      'evals', 'hallucination', 'token', 'latency', 'cost'
    ];

    const grid = document.getElementById('bingo-grid');
    const overlay = document.getElementById('overlay');
    const newCardBtn = document.getElementById('new-card-btn');
    const playAgainBtn = document.getElementById('play-again-btn');
    const overlayClose = document.getElementById('overlay-close');

    function renderGrid() {
      grid.innerHTML = '';
      buzzwords.forEach((word, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = word;
        cell.dataset.index = i;
        cell.setAttribute('role', 'button');
        cell.setAttribute('aria-pressed', 'false');
        cell.setAttribute('tabindex', '0');

        if (i === 12) {
          cell.classList.add('marked', 'free-space');
          cell.setAttribute('aria-pressed', 'true');
        }

        grid.appendChild(cell);
      });
    }

    renderGrid();

    grid.addEventListener('click', (e) => {
      const cell = e.target.closest('.cell');
      if (!cell || cell.classList.contains('free-space')) return;
      cell.classList.toggle('marked');
      cell.setAttribute('aria-pressed', cell.classList.contains('marked'));
    });

    grid.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        e.target.click();
      }
    });

    function showOverlay() {
      overlay.classList.add('visible');
    }

    function hideOverlay() {
      overlay.classList.remove('visible');
    }

    overlayClose.addEventListener('click', hideOverlay);
    playAgainBtn.addEventListener('click', hideOverlay);
    newCardBtn.addEventListener('click', () => {
      renderGrid();
    });
  </script>
</body>
</html>
